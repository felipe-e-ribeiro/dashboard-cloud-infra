{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard-cloud.frontendFullname" . }}-nginx
  labels:
    {{- include "dashboard-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Same routing as frontend/nginx.conf, but proxy_pass targets the backend
  # Service this chart creates instead of the docker-compose "backend" hostname.
  default.conf: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ include "dashboard-cloud.backendFullname" . }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth/ {
            proxy_pass http://{{ include "dashboard-cloud.backendFullname" . }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri /index.html;
        }
    }
{{- end }}
