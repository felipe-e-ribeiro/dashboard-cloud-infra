{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dashboard-cloud.secretName" . }}
  labels:
    {{- include "dashboard-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "dashboard-cloud.databaseUrl" . | quote }}
  admin-database-url: {{ include "dashboard-cloud.adminDatabaseUrl" . | quote }}
  postgres-db: {{ .Values.postgres.database | quote }}
  jwt-secret: {{ .Values.config.jwtSecret | quote }}
  admin-username: {{ .Values.config.adminUsername | quote }}
  admin-password: {{ .Values.config.adminPassword | quote }}
  secrets-encryption-key: {{ .Values.config.secretsEncryptionKey | quote }}
{{- end }}
