apiVersion: v1
kind: Service
metadata:
  name: {{ include "dashboard-cloud.backendFullname" . }}
  labels:
    {{- include "dashboard-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "dashboard-cloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
