apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dashboard-cloud.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "dashboard-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.migrationJob.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dashboard-cloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      volumes:
        - name: db-init-script
          configMap:
            name: {{ include "dashboard-cloud.fullname" . }}-db-init
      # 1) Check whether the target database exists and create it if not.
      initContainers:
        - name: db-init
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "/scripts/db_init.py"]
          volumeMounts:
            - name: db-init-script
              mountPath: /scripts
          env:
            - name: ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: admin-database-url
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: postgres-db
      # 2) Apply any pending Alembic schema migrations.
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          workingDir: /app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: database-url
            # alembic/env.py imports app.config.settings, which requires every one
            # of these to be set even though only DATABASE_URL is actually used here.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: jwt-secret
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: admin-password
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard-cloud.secretName" . }}
                  key: secrets-encryption-key
