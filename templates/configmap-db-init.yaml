apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard-cloud.fullname" . }}-db-init
  labels:
    {{- include "dashboard-cloud.labels" . | nindent 4 }}
data:
  db_init.py: |
    # Ensures the application database exists before Alembic migrations run.
    import os
    import sys

    import psycopg
    from psycopg import sql


    def main() -> None:
        admin_dsn = os.environ["ADMIN_DATABASE_URL"]
        target_db = os.environ["POSTGRES_DB"]

        with psycopg.connect(admin_dsn, autocommit=True) as conn:
            with conn.cursor() as cur:
                cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (target_db,))
                if cur.fetchone():
                    print(f"Database '{target_db}' already exists, skipping creation.")
                    return
                print(f"Database '{target_db}' does not exist, creating it...")
                cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(target_db)))
                print(f"Database '{target_db}' created.")


    if __name__ == "__main__":
        try:
            main()
        except Exception as exc:  # noqa: BLE001
            print(f"db-init failed: {exc}", file=sys.stderr)
            sys.exit(1)
