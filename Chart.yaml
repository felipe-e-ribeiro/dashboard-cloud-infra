apiVersion: v2
name: dashboard-cloud
description: >
  Helm chart for the Cloud Cost Dashboard (FastAPI backend + nginx/React frontend).
  Does not provision Postgres itself — it expects an existing Postgres server and
  ships a pre-install/pre-upgrade Job that creates the application database (if it
  doesn't already exist) and applies pending Alembic schema migrations.
type: application
version: 0.1.0
appVersion: "1.0.0"
