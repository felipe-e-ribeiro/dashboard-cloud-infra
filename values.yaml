# dashboard-cloud -- Cloud Cost Dashboard (AWS + OCI, single user). Ver
# https://github.com/felipe-e-ribeiro/dashboard-cloud pro código.
#
# Migrado do chart bespoke (Deployment/Service/Ingress/Job de migração
# escritos à mão) pro platform-chart em 2026-09-13 -- mesmo padrão do
# pulse-infra/checklist-compras-infra. Ver PERSONAL-INFRA-CONTEXT.md.

platform-chart:
  image:
    registry: "" # deixe vazio -- api/frontend já usam repository completo (ghcr.io/...)
  api:
    enabled: true
    image:
      repository: ghcr.io/felipe-e-ribeiro/dashboard-cloud-backend
      tag: "0.10" # bumpado manualmente por enquanto -- ver README "Deploy de uma imagem nova"
    port: 8000
    probes:
      path: /health
    # SEM migration.enabled: a própria imagem do backend já roda
    # `alembic upgrade head` antes do uvicorn no CMD do Dockerfile
    # (backend/Dockerfile) -- com replicaCount fixo em 1 (sem
    # autoscaling, uso pessoal de um usuário só) não existe race de
    # múltiplos pods migrando ao mesmo tempo, então o initContainer de
    # migration do platform-chart seria só redundância aqui.
  frontend:
    enabled: true
    image:
      repository: ghcr.io/felipe-e-ribeiro/dashboard-cloud-frontend
      tag: "0.10"
    port: 8080 # nginx.conf (frontend/nginx.conf) escuta 8080, não 80
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    host: "dash-finops.felipeduribeiro.com.br"
    tls:
      enabled: true
      secretName: "dash-finops-tls"
    apiPath: /api
  # SEM Postgres próprio -- aponta pro Postgres já existente do
  # comprasweb (comprasweb-postgres.comprasweb.svc.cluster.local:5432),
  # banco "dashboard_cloud" dedicado dentro dessa mesma instância (mesmo
  # padrão do pulse, banco "pulse" na mesma instância). Diferente do
  # pulse, usa uma role Postgres própria ("dashboard_cloud", dona do
  # próprio banco) em vez de reaproveitar o usuário/senha do comprasweb.
  postgres:
    enabled: false
  # Produção via ArgoCD/ExternalSecret -- não preencher secrets.data
  # aqui. O Secret "dashboard-cloud-secrets" é criado pelo
  # ExternalSecret (ver templates/external-secret.yaml), a partir do OCI
  # Vault -- ver resources.yaml pras chaves esperadas.
  secrets:
    create: false
    existingSecret: "dashboard-cloud-secrets"
    databaseUrlEnvName: DATABASE_URL

# Usado só pelos templates locais deste chart (templates/external-secret.yaml
# e templates/ingress-auth.yaml) -- não é repassado pro platform-chart.
externalSecret:
  vaultSecretName: "dashboard-cloud-app-secrets"
  kubernetesSecretName: "dashboard-cloud-secrets"
